name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: printwatch-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, printwatch-deploy]
    timeout-minutes: 20
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Deploy and verify production
        env:
          PRINTWATCH_DEPLOY_HOST: local
          PRINTWATCH_DEPLOY_DIR: /home/kotori9/printwatch_ai
        run: ./deploy/deploy.sh
